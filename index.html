<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="soundboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>our soundboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1b20;
      --blue: #bfdaf7;
      --blue-on: #94c2f1;
      --pink: #fde2eb;
      --pink-on: #f8bdd2;
      --muted: #8b8a94;
      --vh: 100vh;
    }
    @supports (height: 100svh) { :root { --vh: 100svh; } }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0 16px;
    }
    .note {
      margin: 0 0 clamp(14px, 3vh, 26px);
      padding: 0 16px;
      text-align: center;
      font-size: clamp(21px, 5.4vw, 28px);
      font-weight: 600;
      letter-spacing: .01em;
      color: var(--ink);
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 0 14px;
    }

    /* n x n grid: the pads form the outer ring and the photo fills the center */
    .board {
      --n: 3;
      --max: 620px;
      --chrome: 206px; /* title, buttons and page padding */
      --w: min(92vw, var(--max), max(300px, var(--vh) - var(--chrome)));
      --gap: clamp(10px, calc(var(--w) * .032), 20px);
      --font: clamp(14px, calc(var(--w) * .04), 23px);
      --radius: 26px;
      --border: 4px;
      --shadow: 6px;
      --press: 4px;
      --space: 8px;
      --badge: 10px;
      --badge-at: 11px;
      --lines: 4;
      --lines-sub: 3;
      --sub: .62em;
      display: grid;
      grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      grid-template-rows: repeat(var(--n), minmax(0, 1fr));
      gap: var(--gap);
      width: var(--w);
      height: var(--w);
    }
    body.editing .board { --chrome: 256px; } /* room for the buttons picker */
    .board[data-size="12"] {
      --n: 4;
      --max: 680px;
      --gap: clamp(7px, calc(var(--w) * .026), 18px);
      --font: clamp(11px, calc(var(--w) * .034), 22px);
      --radius: clamp(17px, calc(var(--w) * .055), 26px);
      --border: clamp(3px, calc(var(--w) * .01), 4px);
      --shadow: clamp(4px, calc(var(--w) * .013), 6px);
      --press: 3px;
      --space: 6px;
      --badge: clamp(7px, calc(var(--w) * .022), 11px);
      --badge-at: clamp(7px, calc(var(--w) * .022), 11px);
      --sub: .7em;
    }
    .board[data-size="16"] {
      --n: 5;
      --max: 720px;
      --gap: clamp(5px, calc(var(--w) * .02), 16px);
      --font: clamp(9.5px, calc(var(--w) * .03), 20px);
      --radius: clamp(13px, calc(var(--w) * .04), 24px);
      --border: clamp(2.5px, calc(var(--w) * .0075), 4px);
      --shadow: clamp(3px, calc(var(--w) * .01), 6px);
      --press: 2px;
      --space: 3px;
      --badge: clamp(6px, calc(var(--w) * .017), 11px);
      --badge-at: clamp(5px, calc(var(--w) * .016), 11px);
      --lines: 3;
      --sub: .8em;
    }
    .cell { min-width: 0; min-height: 0; }
    .photo { grid-area: 2 / 2 / -2 / -2; display: flex; align-items: center; justify-content: center; }
    .photo img {
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform-origin: 50% 85%;
    }
    .photo.dancing img { animation: dance 1.1s ease-in-out infinite; }
    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(-2.5deg); }
      25% { transform: translateY(-3.5%) rotate(0deg); }
      50% { transform: translateY(0) rotate(2.5deg); }
      75% { transform: translateY(-3.5%) rotate(0deg); }
    }

    .pad {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: var(--space);
      border: var(--border) solid var(--ink);
      border-radius: var(--radius);
      background: var(--blue);
      box-shadow: 0 var(--shadow) 0 var(--ink);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: var(--font);
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform .06s ease, box-shadow .06s ease, background-color .12s ease;
    }
    .pad[hidden] { display: none; }
    .pad .name {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--lines);
      overflow: hidden;
      max-width: 100%;
    }
    .pad.empty .name { -webkit-line-clamp: var(--lines-sub); }
    .pad.pink { background: var(--pink); }
    .pad:active, .pad.hit { transform: translateY(var(--press)); box-shadow: 0 calc(var(--shadow) - var(--press)) 0 var(--ink); }
    .pad.squish { animation: squish .26s ease-out; }
    @keyframes squish {
      30% { scale: 1.09 .9; }
      65% { scale: .96 1.05; }
    }
    .pad.playing { background: var(--blue-on); }
    .pad.pink.playing { background: var(--pink-on); }
    /* little stop square while a sound plays: tap the pad again to stop it */
    .pad.playing::before {
      content: '';
      position: absolute;
      top: var(--badge-at);
      right: var(--badge-at);
      width: var(--badge);
      height: var(--badge);
      border-radius: 2px;
      background: var(--ink);
    }
    body.editing .pad.playing::before { display: none; }
    .pad:focus-visible { outline: 3px solid var(--blue-on); outline-offset: 4px; }

    .pad.empty {
      background: #fff;
      border-style: dashed;
      box-shadow: none;
      color: var(--muted);
      font-weight: 500;
    }
    .pad.empty:active, .pad.empty.hit { transform: translateY(2px); }
    .pad .plus { font-size: 2em; line-height: .9; font-weight: 500; }
    .pad .sub { font-size: var(--sub); font-weight: 500; color: var(--muted); }

    .pad.loading::after {
      content: '';
      position: absolute;
      bottom: var(--badge-at);
      width: 22%;
      height: calc(var(--badge) * .4);
      border-radius: 4px;
      background: var(--ink);
      opacity: .25;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .6; } }

    .pad .pencil {
      display: none;
      position: absolute;
      top: calc(var(--radius) * .23);
      right: calc(var(--radius) * .35);
      font-size: .75em;
    }
    body.editing .pad .pencil { display: block; }
    body.editing .pad { animation: wiggle 1s ease-in-out infinite; }
    body.editing .pad.blue { animation-delay: -.5s; }
    @keyframes wiggle { 0%, 100% { rotate: -1.5deg; } 50% { rotate: 1.5deg; } }

    .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 10; }
    .heart {
      position: absolute;
      width: var(--size);
      height: var(--size);
      margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
      animation: heart-float .9s ease-out both;
    }
    .heart svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .heart path { fill: var(--pink); stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; }
    .heart.blue path { fill: var(--blue); }
    @keyframes heart-float {
      from { transform: translate(0, 0) scale(.5); opacity: 0; }
      12%, 55% { opacity: 1; }
      to { transform: translate(var(--dx), var(--dy)) scale(1.05) rotate(var(--spin)); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      body.editing .pad, .pad.squish, .photo.dancing img { animation: none; }
    }

    .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .picker {
      display: none;
      align-items: center;
      gap: 2px;
      padding: 3px 6px 3px 14px;
      font-size: 15px;
      font-weight: 600;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
    }
    body.editing .picker { display: flex; }
    .picker span:first-child { margin-right: 4px; }
    .picker button {
      min-width: 36px;
      padding: 6px 8px;
      font: inherit;
      color: var(--ink);
      background: none;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .picker button[aria-pressed="true"] { background: var(--pink); }
    .status { min-height: 1.3em; margin: 0; color: var(--muted); font-size: 15px; text-align: center; }

    .btn {
      font: inherit;
      font-weight: 600;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 9px 18px;
      box-shadow: 0 3px 0 var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .06s ease, box-shadow .06s ease;
    }
    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.primary { background: var(--pink); }
    .btn.blue { background: var(--blue); }
    .btn.quiet { border-color: transparent; box-shadow: none; background: none; color: var(--muted); padding-left: 8px; padding-right: 8px; }
    .btn.danger { color: #c2185b; }
    .btn.recording { background: #ffd6d6; }

    dialog {
      width: min(92vw, 390px);
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 20px 20px 18px;
      box-shadow: 0 8px 0 var(--ink);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(255, 255, 255, .78); }
    dialog h2 { margin: 0 0 14px; font-size: 22px; font-weight: 600; outline: none; }
    dialog label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .text {
      width: 100%;
      font: inherit;
      font-size: 18px;
      padding: 10px 14px;
      border: 3px solid var(--ink);
      border-radius: 16px;
      outline: none;
    }
    .text:focus { background: #f7fbff; }
    .sound-info { margin: 16px 0 10px; font-size: 15px; }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1 1 0; min-width: 0; padding: 9px 4px; font-size: 15px; white-space: nowrap; }
    .msg { min-height: 1.3em; margin: 12px 0 0; font-size: 14px; color: #c2185b; }
    .msg.ok { color: var(--muted); }
    .footer { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
    .footer .spacer { flex: 1; }
    .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* small phones (320 to 360px wide): give the editor buttons a bit more room */
    @media (max-width: 360px) {
      dialog { max-width: none; padding: 18px 12px 16px; }
      .row { gap: 6px; }
      .row .btn { font-size: 13px; padding: 9px 2px; }
      .footer { gap: 4px; }
    }
  </style>
</head>

  <dialog id="editor">
    <h2 id="edTitle" tabindex="-1" autofocus>pad 1</h2>

    <label for="edLabel">button label</label>
    <input class="text" id="edLabel" maxlength="24" placeholder="name it…" autocomplete="off">

    <p class="sound-info" id="edInfo">no sound yet</p>
    <div class="row">
      <button type="button" class="btn blue" id="edRecord">● record</button>
      <button type="button" class="btn" id="edUpload">⬆&#xFE0E; upload</button>
      <button type="button" class="btn" id="edPreview">▶&#xFE0E; play</button>
    </div>
    <input type="file" id="edFile" class="hidden-input" accept="audio/*" tabindex="-1">

    <p class="msg" id="edMsg" role="status" aria-live="polite"></p>

    <div class="footer">
      <button type="button" class="btn quiet danger" id="edRemove">remove</button>
      <span class="spacer"></span>
      <button type="button" class="btn quiet" id="edCancel">cancel</button>
      <button type="button" class="btn primary" id="edSave">save</button>
    </div>
  </dialog>

  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <script>
    // Paste your Apps Script web app URL here (Deploy > Manage deployments > the /exec link).
    const API_URL = 'https://script.google.com/macros/s/AKfycbwPETmZl0TjPCnAWOCiQ4NNHN9XnIXOFQK1b9k1bUtRDyMLlSaY_3hkZVHT0KWoXQ9M/exec';

    // use the cat photo as the tab icon (reuses the image already on the page)
    const icon = document.createElement('link');
    icon.rel = 'icon';
    icon.href = document.querySelector('.photo img').src;
    document.head.appendChild(icon);

    const SLOTS = 16;         // pads stored; the board shows 8, 12 or 16 of them
    const SIZES = [8, 12, 16];
    const MAX_SECONDS = 10;   // longest clip kept
    const RATE = 22050;       // saved clips are mono 16-bit WAV at this rate (~44 KB per second)
    const MAX_HEARTS = 30;

    const $ = (id) => document.getElementById(id);
    const pads = Array.from({ length: SLOTS }, () => ({ label: '', hasSound: false, buffer: null, loading: false }));
    const padEls = Array.from({ length: SLOTS }, () => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'cell pad';
      $('board').append(el);
      return el;
    });
    const playing = new Array(SLOTS).fill(null);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let boardSize = 8;
    let savedSize = 8;    // the size the server has
    let sizeSaving = false;
    let cells = [];       // [row, col] of each showing pad
    let booting = true;
    let editing = false;
    let ctx = null;

    const els = {
      status: $('status'), editToggle: $('editToggle'), dlg: $('editor'), title: $('edTitle'),
      label: $('edLabel'), info: $('edInfo'), rec: $('edRecord'), upload: $('edUpload'),
      preview: $('edPreview'), file: $('edFile'), msg: $('edMsg'), remove: $('edRemove'),
      cancel: $('edCancel'), save: $('edSave'), board: $('board'), picker: $('sizePicker'),
      photo: document.querySelector('.photo'), hearts: $('hearts'),
    };

    // ---------- server calls ----------
    // text/plain keeps this a "simple" request, so the browser doesn't send a preflight Apps Script can't answer.
    async function run(action, fields) {
      if (!API_URL) throw new Error('not connected yet: paste the web app url into API_URL');
      if (!/\/exec(\?|$)/.test(API_URL)) throw new Error('not connected: API_URL should be the web app link ending in /exec');
      let res;
      try {
        res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...fields }),
        });
      } catch (e) {
        throw new Error('couldn’t reach the server. check your connection');
      }
      let data;
      try { data = await res.json(); } catch (e) { throw new Error('the server sent something unexpected'); }
      if (!data.ok) throw new Error(data.error || 'something went wrong');
      return data.result;
    }

    // ---------- audio ----------
    function audio() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        ctx = new AC();
        setSessionType('playback');
      }
      if (ctx.state !== 'running') ctx.resume().catch(() => {});
      return ctx;
    }
    // iOS: 'playback' keeps sounds playing with the silent switch on. Recording needs 'play-and-record',
    // and switching back afterwards stops playback staying quiet after the mic was used.
    function setSessionType(type) {
      try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
    }
    // Touch browsers only unlock audio on a finished tap, so unlock on the first one anywhere.
    // iOS also leaves audio 'interrupted' after calls or locking the phone, so resume from any non-running state.
    ['pointerup', 'touchend', 'click', 'keydown'].forEach((type) =>
      document.addEventListener(type, () => { if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); }, true));

    function decode(arrayBuffer) {
      return new Promise((resolve, reject) => audio().decodeAudioData(arrayBuffer, resolve, reject));
    }

    // Plays a buffer and returns a handle with stop(). If audio is still locked, it starts once unlocked
    // (unless it was stopped first).
    function startBuffer(buffer, onEnd) {
      const ac = audio();
      const src = ac.createBufferSource();
      src.buffer = buffer;
      src.connect(ac.destination);
      let state = 'waiting';
      src.onended = () => { state = 'done'; if (onEnd) onEnd(); };
      const go = () => {
        if (state !== 'waiting') return;
        state = 'playing';
        try { src.start(); } catch (e) {}
      };
      if (ac.state === 'running') go(); else ac.resume().then(go).catch(() => {});
      return {
        stop() {
          if (state === 'playing') { try { src.stop(); } catch (e) {} }
          state = 'done';
        },
      };
    }

    function setPlaying(i, handle) {
      playing[i] = handle;
      padEls[i].classList.toggle('playing', !!handle);
      els.photo.classList.toggle('dancing', playing.some(Boolean));
    }

    function stopPad(i) {
      const handle = playing[i];
      if (!handle) return;
      setPlaying(i, null);
      handle.stop();
    }
    function stopAll() { for (let i = 0; i < SLOTS; i++) stopPad(i); }

    // Tap a pad to play it; tap it again while it's playing to stop it.
    function play(i) {
      if (playing[i]) { stopPad(i); return; }
      const p = pads[i];
      if (!p.buffer) {
        toast(p.loading ? 'still loading that one…' : 'that sound didn’t load. trying again…');
        loadVisible();
        return;
      }
      const handle = startBuffer(p.buffer, () => {
        if (playing[i] === handle) setPlaying(i, null);
      });
      setPlaying(i, handle);
      celebrate(padEls[i]);
    }

    function celebrate(el) {
      if (reducedMotion.matches) return;
      el.classList.remove('squish');
      void el.offsetWidth; // restarts the animation if it's still running
      el.classList.add('squish');
      spawnHearts(el);
    }

    function spawnHearts(el) {
      const r = el.getBoundingClientRect();
      const count = 3 + Math.floor(Math.random() * 3);
      for (let k = 0; k < count && els.hearts.childElementCount < MAX_HEARTS; k++) {
        const heart = document.createElement('div');
        heart.className = 'heart' + (k % 2 ? ' blue' : '');
        heart.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21C6 16.5 2 13 2 8.5 2 5.4 4.4 3 7.3 3c1.9 0 3.7 1 4.7 2.6C13 4 14.8 3 16.7 3 19.6 3 22 5.4 22 8.5c0 4.5-4 8-10 12.5z"/></svg>';
        heart.style.left = r.left + r.width * (.2 + Math.random() * .6) + 'px';
        heart.style.top = r.top + r.height * .35 + 'px';
        heart.style.setProperty('--size', Math.min(24, Math.max(13, r.width * .2)) + 'px');
        heart.style.setProperty('--dx', (Math.random() - .5) * r.width * .7 + 'px');
        heart.style.setProperty('--dy', -(r.height * .6 + 40 + Math.random() * 40) + 'px');
        heart.style.setProperty('--spin', (Math.random() - .5) * 50 + 'deg');
        heart.style.animationDelay = k * 45 + 'ms';
        els.hearts.append(heart);
        setTimeout(() => heart.remove(), 1200);
      }
    }

    // Turn any decoded audio into a short, trimmed, normalized mono clip + WAV for saving.
    async function toClip(input) {
      const seconds = Math.min(input.duration, 60);
      const length = Math.max(1, Math.ceil(seconds * RATE));
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const off = new OAC(1, length, RATE);
      const src = off.createBufferSource();
      src.buffer = input;
      src.connect(off.destination);
      src.start();
      const data = (await off.startRendering()).getChannelData(0);

      // trim silence at both ends
      const threshold = 0.02;
      let start = 0, end = data.length - 1;
      while (start < data.length && Math.abs(data[start]) < threshold) start++;
      if (start >= data.length) return null;
      while (end > start && Math.abs(data[end]) < threshold) end--;
      start = Math.max(0, start - Math.round(0.03 * RATE));
      end = Math.min(data.length, end + Math.round(0.15 * RATE));
      let trimmed = false;
      if (end - start > MAX_SECONDS * RATE) { end = start + MAX_SECONDS * RATE; trimmed = true; }
      const out = data.slice(start, end);

      // bring quiet recordings up to a good level (max 4x)
      let peak = 0;
      for (let k = 0; k < out.length; k++) peak = Math.max(peak, Math.abs(out[k]));
      const gain = Math.min(4, 0.95 / peak);
      if (gain > 1) for (let k = 0; k < out.length; k++) out[k] *= gain;

      // tiny fades so clips don't click
      const fadeIn = Math.min(out.length, Math.round(0.005 * RATE));
      const fadeOut = Math.min(out.length, Math.round(0.03 * RATE));
      for (let k = 0; k < fadeIn; k++) out[k] *= k / fadeIn;
      for (let k = 0; k < fadeOut; k++) out[out.length - 1 - k] *= k / fadeOut;

      const buffer = audio().createBuffer(1, out.length, RATE);
      buffer.getChannelData(0).set(out);
      return { buffer, b64: toBase64(encodeWav(out, RATE)), seconds: out.length / RATE, trimmed };
    }

    function encodeWav(samples, rate) {
      const n = samples.length;
      const buf = new ArrayBuffer(44 + n * 2);
      const v = new DataView(buf);
      const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
      str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0, o = 44; i < n; i++, o += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Uint8Array(buf);
    }

    function toBase64(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    }
    function fromBase64(b64) {
      const s = atob(b64);
      const bytes = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
      return bytes.buffer;
    }

    // ---------- board ----------
    function ringCells(n) {
      const ring = [];
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (r === 0 || c === 0 || r === n - 1 || c === n - 1) ring.push([r, c]);
        }
      }
      return ring;
    }

    function nameEl(text) {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = text;
      return name;
    }

    function renderPad(i) {
      if (i >= boardSize) return;
      const p = pads[i];
      const el = padEls[i];
      const [row, col] = cells[i];
      el.className = 'cell pad ' + ((row + col) % 2 ? 'blue' : 'pink') + (playing[i] ? ' playing' : '');
      el.textContent = '';
      if (booting) { el.classList.add('loading'); el.setAttribute('aria-label', 'loading'); return; }

      const pencil = document.createElement('span');
      pencil.className = 'pencil';
      pencil.textContent = '✎';
      pencil.setAttribute('aria-hidden', 'true');

      if (p.hasSound) {
        if (p.loading) el.classList.add('loading');
        el.append(nameEl(p.label || '♪'), pencil);
        el.setAttribute('aria-label', (p.label || 'pad ' + (i + 1)) + (editing ? ', edit' : ', play'));
      } else {
        el.classList.add('empty');
        if (p.label) {
          const sub = document.createElement('span');
          sub.className = 'sub';
          sub.textContent = 'add sound';
          el.append(nameEl(p.label), sub, pencil);
        } else {
          const plus = document.createElement('span');
          plus.className = 'plus';
          plus.textContent = '+';
          plus.setAttribute('aria-hidden', 'true');
          el.append(plus, pencil);
        }
        el.setAttribute('aria-label', 'add a sound to pad ' + (i + 1));
      }
    }
    function renderAll() { for (let i = 0; i < boardSize; i++) renderPad(i); }

    function applySize(size) {
      boardSize = size;
      cells = ringCells(size / 4 + 1);
      els.board.dataset.size = size;
      try { localStorage.setItem('boardSize', size); } catch (e) {}
      padEls.forEach((el, i) => {
        el.hidden = i >= size;
        if (el.hidden) stopPad(i);
        else el.style.gridArea = (cells[i][0] + 1) + ' / ' + (cells[i][1] + 1);
      });
      els.picker.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.size) === size)));
      renderAll();
      loadVisible();
    }

    function loadVisible() {
      for (let i = 0; i < boardSize; i++) {
        const p = pads[i];
        if (!p.hasSound || p.buffer || p.loading) continue;
        p.loading = true;
        renderPad(i);
        loadSound(i);
      }
    }

    function changeSize(size) {
      if (size === boardSize) return;
      const hidesContent = size < boardSize && pads.slice(size).some((p) => p.hasSound || p.label);
      applySize(size);
      if (hidesContent) toast('extra buttons are hidden, not deleted');
      saveSize();
    }

    // One request at a time, so quick taps can't reach the server out of order.
    async function saveSize() {
      if (sizeSaving) return;
      sizeSaving = true;
      try {
        while (savedSize !== boardSize) {
          const size = boardSize;
          await run('setSize', { size });
          savedSize = size;
        }
      } catch (e) {
        if (current >= savedSize) els.dlg.close();
        applySize(savedSize);
        toast('couldn’t change the buttons. try again');
      }
      sizeSaving = false;
    }

    els.picker.addEventListener('click', (e) => {
      const size = Number(e.target.dataset.size);
      if (size) changeSize(size);
    });

    padEls.forEach((el, i) => {
      el.addEventListener('animationend', (e) => { if (e.animationName === 'squish') el.classList.remove('squish'); });
      // play on press (not release) so it feels instant
      el.addEventListener('pointerdown', (e) => {
        if (booting || e.button > 0) return;
        el.classList.add('hit'); // pressed look (iOS ignores :active on its own)
        if (editing || !pads[i].hasSound) return;
        play(i);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) =>
        el.addEventListener(type, () => el.classList.remove('hit')));
      el.addEventListener('click', (e) => {
        if (booting) return;
        if (editing || !pads[i].hasSound) openEditor(i);
        else if (e.detail === 0) play(i); // keyboard Enter/Space
      });
    });
    document.addEventListener('touchstart', () => {}, { passive: true }); // lets :active work on iOS buttons

    document.addEventListener('keydown', (e) => {
      if (els.dlg.open || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') { stopAll(); return; }
      if (editing) return;
      if (!/^[0-9]$/.test(e.key)) return;
      const i = (Number(e.key) + 9) % 10; // 1-9 are pads 1-9, 0 is pad 10
      if (i < boardSize && pads[i].hasSound) {
        play(i);
        const el = padEls[i];
        el.classList.add('hit');
        setTimeout(() => el.classList.remove('hit'), 110);
      }
    });

    els.editToggle.addEventListener('click', () => {
      if (booting) return;
      editing = !editing;
      document.body.classList.toggle('editing', editing);
      els.editToggle.textContent = editing ? '✓ done' : '✎ edit sounds';
      renderAll();
      toast(editing ? 'tap a pad to change it' : '');
    });

    let toastTimer = null;
    function toast(text) {
      els.status.textContent = text;
      clearTimeout(toastTimer);
      if (text) toastTimer = setTimeout(() => { if (els.status.textContent === text) els.status.textContent = ''; }, 3500);
    }

    const validSize = (n) => (SIZES.includes(n) ? n : 8);
    function rememberedSize() {
      try { return validSize(Number(localStorage.getItem('boardSize'))); } catch (e) { return 8; }
    }

    async function init() {
      applySize(rememberedSize());
      try {
        const res = await run('getBoard');
        const board = Array.isArray(res) ? { size: 8, pads: res } : res; // the backend used to return just the array
        board.pads.forEach((b, i) => Object.assign(pads[i], { label: b.label, hasSound: b.hasSound }));
        booting = false;
        savedSize = validSize(board.size);
        applySize(savedSize);
        if (!pads.slice(0, boardSize).some((p) => p.hasSound)) toast('tap a pad to add a sound');
      } catch (e) {
        padEls.forEach((el) => el.classList.remove('loading'));
        const msg = errText(e);
        if (msg.startsWith('not connected')) { els.status.textContent = msg; return; }
        // home screen apps have no refresh button, so the message itself retries
        els.status.textContent = 'couldn’t load the board. tap here to try again';
        els.status.onclick = () => { els.status.onclick = null; els.status.textContent = ''; init(); };
      }
    }

    async function loadSound(i) {
      let buffer = null, gone = false;
      try {
        const b64 = await run('getSound', { index: i });
        if (b64) buffer = await decode(fromBase64(b64));
        else gone = true;
      } catch (e) {
        // leave this pad silent; it can be re-recorded
      }
      if (!pads[i].loading) return; // a new sound was saved or the pad was cleared while this loaded
      pads[i].buffer = buffer;
      if (gone) pads[i].hasSound = false;
      pads[i].loading = false;
      renderPad(i);
      if (current === i) updateInfo();
    }

    // ---------- editor ----------
    let current = -1;     // pad being edited
    let pending = null;   // new clip not saved yet
    let preview = null;
    let recorder = null, recStream = null, recTimer = null, recStart = 0, recStarting = false;
    let busy = false;
    let session = 0;      // bumps on every open/close so late async work for a closed editor is dropped

    function openEditor(i) {
      session++;
      current = i;
      pending = null;
      loadVisible();
      els.title.textContent = 'pad ' + (i + 1);
      els.label.value = pads[i].label;
      els.remove.hidden = !(pads[i].hasSound || pads[i].label);
      disarmRemove();
      say('');
      setBusy(false);
      updateInfo();
      els.dlg.showModal();
    }

    function updateInfo() {
      if (current < 0) return;
      const p = pads[current];
      let text;
      if (pending) text = 'new sound · ' + fmt(pending.seconds) + (pending.trimmed ? ' (cut to ' + MAX_SECONDS + 's)' : '') + ' · not saved yet';
      else if (p.buffer) text = 'current sound · ' + fmt(p.buffer.duration);
      else if (p.hasSound) text = p.loading ? 'current sound · loading…' : 'that sound didn’t load. close this and try again';
      else text = 'no sound yet. record one or upload a file (up to ' + MAX_SECONDS + 's)';
      els.info.textContent = text;
      els.preview.disabled = busy || !!recorder || !(pending || p.buffer);
    }
    const fmt = (s) => (s < 10 ? s.toFixed(1) : Math.round(s)) + 's';
    const errText = (e) => String((e && e.message) || 'try again').replace(/^(Error|Exception):\s*/i, '');

    function say(text, ok) {
      els.msg.textContent = text;
      els.msg.classList.toggle('ok', !!ok);
    }

    function setBusy(on, text) {
      busy = on;
      [els.upload, els.save, els.remove, els.label].forEach((b) => { b.disabled = on || !!recorder; });
      els.rec.disabled = on;
      updateInfo();
      if (on && text) say(text, true);
      else if (!on && els.msg.classList.contains('ok')) say('');
    }

    function stopPreview() {
      if (preview) { try { preview.stop(); } catch (e) {} preview = null; }
    }

    els.preview.addEventListener('click', () => {
      const buf = pending ? pending.buffer : pads[current].buffer;
      if (!buf) return;
      stopPreview();
      preview = startBuffer(buf);
    });

    // record
    els.rec.addEventListener('click', async () => {
      if (recorder) { if (recorder.state === 'recording') recorder.stop(); return; }
      if (recStarting) return; // already waiting on the mic
      audio(); // unlock playback while we still have the tap
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        say('recording isn’t available in this browser. try uploading a voice memo instead');
        return;
      }
      stopPreview();
      const mySession = session;
      recStarting = true;
      setSessionType('play-and-record');
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        recStarting = false;
        releaseMic(null);
        if (mySession === session) say('couldn’t use the mic. allow microphone access, or upload a voice memo instead');
        return;
      }
      recStarting = false;
      if (mySession !== session) { releaseMic(stream); return; } // editor closed meanwhile
      let rec;
      try {
        rec = new MediaRecorder(stream);
      } catch (e) {
        releaseMic(stream);
        say('recording isn’t available in this browser. try uploading a voice memo instead');
        return;
      }
      recStream = stream;
      recorder = rec;
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = async () => {
        clearInterval(recTimer);
        releaseMic(stream);
        recStream = null;
        recorder = null;
        if (mySession !== session) return; // editor was closed mid-recording
        setRecordingUI(false);
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        await useAudio(blob.arrayBuffer(), mySession);
      };
      rec.start();
      recStart = Date.now();
      setRecordingUI(true);
      recTimer = setInterval(() => {
        const s = (Date.now() - recStart) / 1000;
        els.rec.textContent = '■ stop · ' + Math.floor(s) + 's';
        if (s >= MAX_SECONDS + 1 && rec.state === 'recording') rec.stop(); // a little extra for trimmed silence
      }, 200);
    });

    function releaseMic(stream) {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      setSessionType('playback');
    }

    function setRecordingUI(on) {
      els.rec.classList.toggle('recording', on);
      els.rec.textContent = on ? '■ stop · 0s' : '● record';
      setBusy(false);
      if (on) say('recording… tap stop when you’re done', true);
    }

    // upload
    els.upload.addEventListener('click', () => { audio(); els.file.click(); });
    els.file.addEventListener('change', async () => {
      const file = els.file.files && els.file.files[0];
      els.file.value = '';
      if (!file) return;
      stopPreview();
      await useAudio(file.arrayBuffer(), session);
    });

    // bytesPromise: the raw audio file; mySession: the editor session it belongs to
    async function useAudio(bytesPromise, mySession) {
      if (mySession !== session) return;
      setBusy(true, 'getting it ready…');
      let clip;
      try {
        clip = await toClip(await decode(await bytesPromise));
      } catch (e) {
        if (mySession !== session) return;
        setBusy(false);
        say('couldn’t read that audio. try an mp3, m4a or wav file');
        return;
      }
      if (mySession !== session) return; // editor was closed while processing
      setBusy(false);
      if (!clip) { say('that one came out silent. try again a little closer to the mic'); return; }
      pending = clip;
      updateInfo();
      stopPreview();
      preview = startBuffer(clip.buffer); // play it back right away
    }

    // save
    // If the editor gets closed while a save or remove is in flight (cancel, Android back), the result still
    // updates the pad, but never touches whatever editor is open by then.
    els.save.addEventListener('click', async () => {
      const i = current;
      const mySession = session;
      const clip = pending;
      const label = els.label.value.trim();
      if (!clip && label === pads[i].label) { els.dlg.close(); return; }
      setBusy(true, 'saving…');
      try {
        const res = await run('saveSlot', { index: i, label, wav: clip ? clip.b64 : null });
        pads[i].label = res.label;
        pads[i].hasSound = res.hasSound;
        if (clip) { pads[i].buffer = clip.buffer; pads[i].loading = false; }
        renderPad(i);
        toast('saved ♡');
        if (mySession !== session) return;
        setBusy(false);
        els.dlg.close();
      } catch (e) {
        if (mySession !== session) return;
        setBusy(false);
        say('couldn’t save: ' + errText(e));
      }
    });

    // remove (tap twice)
    function disarmRemove() { els.remove.dataset.armed = ''; els.remove.textContent = 'remove'; }
    els.remove.addEventListener('click', async () => {
      if (!els.remove.dataset.armed) {
        els.remove.dataset.armed = '1';
        els.remove.textContent = 'tap again to remove';
        return;
      }
      const i = current;
      const mySession = session;
      setBusy(true, 'removing…');
      try {
        await run('clearSlot', { index: i });
        Object.assign(pads[i], { label: '', hasSound: false, buffer: null, loading: false });
        renderPad(i);
        toast('cleared');
        if (mySession !== session) return;
        setBusy(false);
        els.dlg.close();
      } catch (e) {
        if (mySession !== session) return;
        setBusy(false);
        say('couldn’t remove: ' + errText(e));
      }
    });

    els.cancel.addEventListener('click', () => els.dlg.close());
    els.label.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) els.save.click(); });
    els.dlg.addEventListener('cancel', (e) => { if (busy) e.preventDefault(); });
    els.dlg.addEventListener('close', () => {
      session++;
      if (recorder && recorder.state === 'recording') recorder.stop();
      els.rec.classList.remove('recording');
      els.rec.textContent = '● record';
      stopPreview();
      current = -1;
      pending = null;
    });

    init();
  </script>
</body>
</html>
